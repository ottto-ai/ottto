name: Bug report
description: Report a reproducible problem with the ottto CLI, ottto-service, Ottto.app, installers, or connector packages.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not report security vulnerabilities here; report them privately at https://github.com/ottto-ai/ottto/security/advisories/new (see [SECURITY.md](https://github.com/ottto-ai/ottto/blob/main/SECURITY.md)).
        Before you submit, remove passwords, tokens, cookies, API keys, raw prompts or model output, customer data, account or organization identifiers, email addresses, machine names, and paths that include your user name.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ottto status --json`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ottto version and channel
      description: The `current_version` and `channel` values from `ottto update check --json`.
      placeholder: "0.1.220 (stable)"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Homebrew
        - Ottto.app (DMG or PKG)
        - Built from source
        - Other or not sure
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.5, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Setup or sign-in
        - Status, doctor, verify, or fix
        - Claude Code
        - Codex
        - Pi
        - Diagnostics
        - Update or uninstall
        - Connector packages or schemas
        - Documentation
        - Other
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Optional. The smallest redacted excerpt of the failing command's output that shows the problem; `--json` output is easiest to read. Review it before you paste it, and do not attach full diagnostics bundles.
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I removed secrets, raw prompts or model output, customer data, account and machine identifiers, and paths that include my user name.
          required: true
        - label: This is not a security vulnerability.
          required: true

name: Feature request
description: Suggest an improvement to the ottto CLI, ottto-service, Ottto.app, connector packages, or docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include secrets, customer data, or private repository material.
        New source or collector packages follow [docs/connectors.md](https://github.com/ottto-ai/ottto/blob/main/docs/connectors.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should Ottto do instead? Include example commands or JSON output if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - Local service
        - Ottto.app
        - Claude Code
        - Codex
        - Pi
        - Connector packages or schemas
        - Install, update, or release
        - Documentation
        - Other

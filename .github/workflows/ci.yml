name: Public CI

on:
  # Drafts run nothing: ready_for_review starts the run the merge guard waits
  # for, and the merge queue reruns every required check on the merged commit.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  # Daily main-ref run refreshes the macOS cargo cache (save-if needs
  # refs/heads/main) now that main pushes skip Rust contracts: one hosted Mac
  # run per day instead of one per merge. Quiet hour, away from queue Macs.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      rust_test_filter:
        description: Partial pre-check only (never merge evidence); Rust test path substring, empty runs the full suite
        type: string
        default: ""
      money_equivalence:
        description: Compare emitted retained Tail/Unchanged money with cold Full (synthetic inputs)
        type: boolean
        default: false
      money_equivalence_base:
        description: Comparison ref (empty uses the fork point from this branch PR base, otherwise main)
        type: string
        default: ""
      scan_stack_margin:
        description: Release-build receipt that a scan cycle with a durable restore fits the 2 MiB spawn default (synthetic inputs)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.money_equivalence && '-money-equivalence' || '' }}${{ inputs.scan_stack_margin && '-scan-stack-margin' || '' }}${{ github.event_name == 'schedule' && '-cache-refresh' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.rust_test_filter != '' && !(inputs.money_equivalence || inputs.scan_stack_margin) && '-rust-filter' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    # Keep this literal: skipped jobs can expose an unevaluated name expression.
    # Partial dispatches run in the separate, explicitly named job below.
    name: Rust contracts
    # macOS runs only in the merge queue, on dispatch and on the daily main
    # cache-refresh schedule: GitHub Free allows five hosted Macs org-wide.
    # Main pushes skip the repeat because the queue already tests the exact
    # merged commit. On a PR the skipped job reports success for the required
    # check; the ruleset's merge_queue rule makes every merge pass this job in
    # the queue. Rollback: revert step 3 (Mac on PRs) FIRST, then the queue
    # rule; never leave the PR skip without the queue. Step 4 (this main-push
    # skip) can be reverted on its own at any time.
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && (inputs.money_equivalence || inputs.scan_stack_margin || inputs.rust_test_filter != '')) }}
    # Main's own queue run takes about 38 min (runs 40321546891, 40331916601,
    # 40348583388); 40 cancelled #791 (run 40378483829). Headroom, not a target.
    timeout-minutes: 55
    runs-on: macos-15
    env: &rust-contract-env
      OTTTO_REQUIRE_LAYOUT: "1"
      # Job-level so every cargo step shares one build profile.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Dispatch-only; the special-purpose dispatch jobs keep their precedence.
      # Queue/schedule runs always execute the original full commands below.
      OTTTO_CI_TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_test_filter || '' }}
    steps: &rust-contract-steps
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Identify partial pre-check
        if: env.OTTTO_CI_TEST_FILTER != ''
        run: |
          set -euo pipefail
          # A single Rust path substring, never shell code or test-runner flags.
          if [[ ! "$OTTTO_CI_TEST_FILTER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_:]*$ ]]; then
            echo "::error::rust_test_filter must contain only Rust path characters (letters, digits, underscores, colons)"
            exit 1
          fi
          echo "::warning::Partial Rust pre-check only; a full merge-queue run is still required"
          printf '### Partial Rust pre-check\n\nFilter: %s\n\nOnly matching non-ignored tests run. Layout and peak-memory receipts are omitted. This is not merge evidence; the full merge-queue run is still required.\n' "$OTTTO_CI_TEST_FILTER" >> "$GITHUB_STEP_SUMMARY"

      # Cache: save-if stays refs/heads/main: only the schedule and manual
      # main dispatches save. merge_group runs restore main's cache, which can
      # be up to 24 h old. If queue builds slow down, add a second cron; do NOT
      # save from queue refs. Workspace crates are not cached. Partial
      # pre-checks restore the same "rust" key.
      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt clippy
          cache-key: rust
          cache-save: ${{ github.ref == 'refs/heads/main' && env.OTTTO_CI_TEST_FILTER == '' }}
          cache-bin: "false"

      - name: macOS-native public surface checks
        # Real plutil/codesign/LaunchServices and macOS /bin/bash 3.2; the
        # portable remainder runs in "Public surface checks" on Linux.
        run: /bin/bash scripts/public_repo_surface_ci.sh --scope macos

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

      - name: Runtime clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Connector clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Runtime tests
        if: env.OTTTO_CI_TEST_FILTER == ''
        # Same tests as `cargo test --workspace --locked -- --nocapture`. The
        # ottto-service #[serial] tests run one at a time in a second process
        # beside the rest (3 threads), so threads stop idling on serial locks.
        # Six shared-state races appeared above 4 threads in one process.
        # Dispatch and merge-queue runs keep going past a failing test binary
        # so scripts/mac_batch.py report can map every failure to a PR; the
        # schedule run still stops at the first failing binary.
        # --require-pass is the layout coverage receipt: with
        # OTTTO_REQUIRE_LAYOUT=1 that test passes only on a validated layout,
        # and the step fails unless it printed "... ok" (not ignored, not absent).
        run: >-
          python3 scripts/ci_runtime_tests.py --threads 3 --serial-threads 1
          --require-pass heap_layout_bound::sampled_scalar_buffer_tests::layout_gate_coverage_receipt
          ${{ github.event_name != 'schedule' && '--no-fail-fast' || '' }}

      - name: Filtered Rust tests (partial pre-check)
        if: env.OTTTO_CI_TEST_FILTER != ''
        run: |
          set -euo pipefail
          # A name filter saves execution time, not compilation: both workspaces
          # still build their test binaries. Pass one quoted positional argument.
          # Dispatch-only job: keep going past a failing test binary, as in
          # "Runtime tests", so every failure is listed.
          cargo test --workspace --locked --no-fail-fast "$OTTTO_CI_TEST_FILTER" -- --nocapture --test-threads=4 2>&1 | tee "$RUNNER_TEMP/filtered-rust-tests.log"
          cargo test --manifest-path crates/Cargo.toml --workspace --locked --no-fail-fast "$OTTTO_CI_TEST_FILTER" -- --nocapture --test-threads=4 2>&1 | tee -a "$RUNNER_TEMP/filtered-rust-tests.log"
          # Cargo succeeds when nothing matches. A typo or ignored-only filter
          # must fail this pre-check, including when the other workspace is empty.
          grep -E '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/filtered-rust-tests.log"

      # Includes ottto-connector-testkit's first_party_sources contract tests.
      - name: Connector tests
        if: env.OTTTO_CI_TEST_FILTER == ''
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

  rust-partial:
    # Separate static names also preserve the full check when either job skips.
    name: Rust contracts (partial pre-check)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_test_filter != '' && !(inputs.money_equivalence || inputs.scan_stack_margin) }}
    timeout-minutes: 55
    runs-on: macos-15
    env: *rust-contract-env
    steps: *rust-contract-steps

  public-surface:
    if: ${{ !github.event.pull_request.draft && !(github.event_name == 'workflow_dispatch' && (inputs.money_equivalence || inputs.scan_stack_margin)) }}
    name: Public surface checks
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Pinned binary with the action's per-version SHA-256; no unverified
      # cargo-install fallback.
      - name: Install shellcheck
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: shellcheck@0.11.0
          fallback: none

      - name: Tool receipt
        run: |
          set -euo pipefail
          shellcheck --version | grep -Fx 'version: 0.11.0'
          bash --version | head -n1
          jq --version
          python3 --version
          cargo -V

      - name: Public surface gate
        run: bash scripts/public_repo_surface_ci.sh --scope portable

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust-advisories:
    if: ${{ !github.event.pull_request.draft && !(github.event_name == 'workflow_dispatch' && (inputs.money_equivalence || inputs.scan_stack_margin)) }}
    name: Rust advisory audit
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # cargo audit reads only the lockfiles, so the runner OS does not matter.
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Runtime advisory audit
        run: cargo audit --deny warnings

      - name: Connector advisory audit
        run: cargo audit --deny warnings
        working-directory: crates

  scan-stack-margin:
    name: Scan worker stack margin
    # Manual dispatch only (scan_stack_margin=true), never on a pull request,
    # push or merge queue. One standard Mac, one release test build, no
    # matrix, retry or cache. The receipt that the scan workers' explicit
    # stack (SNAPSHOT_SYNC_WORKER_STACK_BYTES) is headroom over a cycle that
    # fits the 2 MiB default; an overflow aborts the test binary.
    if: github.event_name == 'workflow_dispatch' && inputs.scan_stack_margin && !inputs.money_equivalence
    timeout-minutes: 40
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Release 2 MiB receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo test -p ottto-service --lib --locked --release scan_worker_stack_margin_receipt -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/stack-margin.log"
          grep -q '^SCAN_STACK_MARGIN_RECEIPT ' "$RUNNER_TEMP/stack-margin.log"
          grep -q '^test result: ok\. 1 passed' "$RUNNER_TEMP/stack-margin.log"

  money-equivalence:
    name: Money equivalence (emitted bodies)
    permissions:
      contents: read
      pull-requests: read # Resolve the branch PR base on dispatch.
    # Opt-in only: no added macOS minutes on pushes/PRs. One standard Mac,
    # two independent builds, no matrix/retry or cache writes. Never run the
    # expensive benchmark or ordinary Mac jobs alongside this dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.money_equivalence
    timeout-minutes: 55
    runs-on: macos-15
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      MONEY_EQUIVALENCE_BASE: ${{ inputs.money_equivalence_base }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup
      - name: Compare identical synthetic inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/money_equivalence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: money-equivalence-receipts
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/money-equivalence/receipts

name: Public CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      money_base_comparison:
        description: Compare the saved gate-off fixtures with main
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust contracts
    timeout-minutes: 40
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      OTTTO_REQUIRE_LAYOUT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Keep layout-sensitive tests on the compiler validated by the runtime.
      - name: Install validated Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

      - name: Runtime clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Connector clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Runtime tests
        # Print a failing assertion when it happens, not only after the suite.
        run: cargo test --workspace --locked -- --nocapture

      - name: Layout coverage receipt
        run: |
          set -euo pipefail
          cargo test -p ottto-service --lib --locked heap_layout_bound::sampled_scalar_buffer_tests::layout_gate_coverage_receipt -- --exact --nocapture | tee "$RUNNER_TEMP/layout-coverage-receipt.log"
          # An exact filter matching zero tests must not count as a receipt.
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/layout-coverage-receipt.log"

      - name: Connector tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

      - name: Connector package tests
        run: cargo test --manifest-path crates/Cargo.toml --locked -p ottto-connector-testkit --test first_party_sources

  public-surface:
    name: Public surface checks
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install script prerequisites
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          set -euo pipefail
          brew untap aws/tap azure/bicep 2>/dev/null || true
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Public surface gate
        run: bash scripts/public_repo_surface_ci.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust-advisories:
    name: Rust advisory audit
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Runtime advisory audit
        run: cargo audit --deny warnings

      - name: Connector advisory audit
        run: cargo audit --deny warnings
        working-directory: crates

  money-base-comparison:
    name: Saved money gate-off comparison
    if: github.event_name == 'workflow_dispatch' && inputs.money_base_comparison
    timeout-minutes: 40
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      OTTTO_REQUIRE_LAYOUT: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Compare real callers against identical saved inputs
        shell: bash
        run: |
          set -euo pipefail
          export OTTTO_MONEY_PARITY_ROOT="$RUNNER_TEMP/money-saved-inputs"
          # Separate targets force each source tree to compile independently.
          # Shared targets can reuse the base binary after a worktree switch.
          git worktree add --detach "$RUNNER_TEMP/money-base" dba838f067ed58f8d45f6af1a6cabae1e08fc837
          cp crates/ottto-service/src/snapshot_sync/request_identity_pipeline_tests.rs "$RUNNER_TEMP/money-base/crates/ottto-service/src/snapshot_sync/request_identity_pipeline_tests.rs"
          # Match the test-only observer's fixed storage in both binaries.
          # Runtime source, measured allocations and overflow assertions stay intact.
          python3 - "$RUNNER_TEMP/money-base" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1]) / "crates/ottto-service/src/retry_allocation_probe.rs"
          source = path.read_text()
          old = "const SLOTS: usize = 65_536;"
          assert source.count(old) == 1
          path.write_text(source.replace(old, "const SLOTS: usize = 1_048_576;"))
          PY

          CARGO_TARGET_DIR="$RUNNER_TEMP/money-head-target" cargo test -p ottto-service --lib --locked --no-run --message-format=json > "$RUNNER_TEMP/money-head-build.jsonl"
          money_head_binary="$(python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; bins=[row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("executable")]; assert len(bins)==1, bins; print(bins[0])' "$RUNNER_TEMP/money-head-build.jsonl")"
          # The base test execs the independently built head test after all
          # assertions pass. A fresh image preserves only the PID, avoiding
          # nondeterministic serialized census-witness digit counts.
          CARGO_TARGET_DIR="$RUNNER_TEMP/money-base-target" OTTTO_MONEY_PARITY_OUTPUT="$RUNNER_TEMP/money-base.json" OTTTO_MONEY_PARITY_NEXT_BINARY="$money_head_binary" OTTTO_MONEY_PARITY_NEXT_OUTPUT="$RUNNER_TEMP/money-head.json" cargo test --manifest-path "$RUNNER_TEMP/money-base/Cargo.toml" -p ottto-service --lib --locked money_gate_off_saved_fixture_receipt -- --nocapture
          # Isolated processes measure current RSS with the same pre-generated
          # M4 input and armed P1 resident; allocator audits stay inactive.
          CARGO_TARGET_DIR="$RUNNER_TEMP/money-base-target" OTTTO_MONEY_RSS_OUTPUT="$RUNNER_TEMP/money-base-rss.json" cargo test --manifest-path "$RUNNER_TEMP/money-base/Cargo.toml" -p ottto-service --lib --locked money_gate_off_rss_fixture_receipt -- --nocapture
          CARGO_TARGET_DIR="$RUNNER_TEMP/money-head-target" OTTTO_MONEY_RSS_OUTPUT="$RUNNER_TEMP/money-head-rss.json" cargo test -p ottto-service --lib --locked money_gate_off_rss_fixture_receipt -- --nocapture
          CARGO_TARGET_DIR="$RUNNER_TEMP/money-head-target" OTTTO_MONEY_ISOLATED_RSS=1 cargo test -p ottto-service --lib --locked money_m4_sized_ledger_and_page_are_measured -- --nocapture
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          base = json.loads((root / "money-base-rss.json").read_text())
          head = json.loads((root / "money-head-rss.json").read_text())
          assert base["ledger_hashes"] == head["ledger_hashes"] == 554400
          result = {"baseline_release": "0.1.189", "baseline_source": "dba838f067ed58f8d45f6af1a6cabae1e08fc837", "base_rss_bytes": base["rss_median_bytes"], "head_rss_bytes": head["rss_median_bytes"], "delta_bytes": head["rss_median_bytes"] - base["rss_median_bytes"], "p1_shadow_resident": True, "live_gate": False, "matched_source_build_fixture": True, "release_daemon_rss": False}
          (root / "money-rss-comparison.json").write_text(json.dumps(result, indent=2) + "\n")
          print("MONEY_RSS_OFF_COMPARISON " + json.dumps(result, sort_keys=True))
          delta = head["ledger_resident_bytes"] - base["ledger_resident_bytes"]
          print(f'MONEY_M4_DELTA_VS_189 base_resident={base["ledger_resident_bytes"]} head_off_resident={head["ledger_resident_bytes"]} delta={delta} base_load_peak={base["load_native_peak"]} head_off_load_peak={head["load_native_peak"]} base_save_peak={base["save_native_peak"]} head_off_save_peak={head["save_native_peak"]} base_rss={base["rss_median_bytes"]} head_off_rss={head["rss_median_bytes"]} rss_delta={result["delta_bytes"]} resident_is_structural=true peaks_are_native_usable=true matched_observer_slots=1048576')
          assert delta <= 0, "gate-OFF resident layout must not grow over 0.1.189"

          PY
          diff -u "$RUNNER_TEMP/money-base.json" "$RUNNER_TEMP/money-head.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: money-gate-off-receipts
          path: ${{ runner.temp }}/money-*.json

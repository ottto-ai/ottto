name: Public CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      composition_buffer_probe:
        description: Diagnostic-only exact-reader six-parse reproduction
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe && 'Composition CPU reproduction' || 'Rust contracts' }}
    timeout-minutes: 40
    runs-on: macos-15
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

      - name: Runtime clippy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Connector clippy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Runtime tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
        run: cargo test --workspace --locked

      - name: Layout coverage receipt
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
        run: |
          set -euo pipefail
          cargo test -p ottto-service --lib --locked heap_layout_bound::sampled_scalar_buffer_tests::layout_gate_coverage_receipt -- --exact --nocapture | tee "$RUNNER_TEMP/layout-coverage-receipt.log"
          # An exact filter matching zero tests must not count as a receipt.
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/layout-coverage-receipt.log"

      - name: Context composition parity and resource receipt
        if: github.event_name == 'workflow_dispatch' && !inputs.composition_buffer_probe
        run: |
          set -euo pipefail
          cargo test -p ottto-service --lib --locked context_composition::tests::parity_resource::compact_resource_receipt -- --exact --ignored --nocapture --test-threads=1 | tee "$RUNNER_TEMP/composition-resource-receipt.log"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/composition-resource-receipt.log"
          grep 'COMPOSITION_RESOURCE_RECEIPT ' "$RUNNER_TEMP/composition-resource-receipt.log"

      - name: Bounded exact-reader reproduction
        if: github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe
        run: |
          set -euo pipefail
          cargo test -p ottto-service --lib --locked context_composition::tests::parity_resource::unprofiled_worst_case_receipt -- --exact --ignored --nocapture --test-threads=1 | tee "$RUNNER_TEMP/composition-buffer-receipt.log"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/composition-buffer-receipt.log"
          grep 'COMPOSITION_UNPROFILED_RECEIPT ' "$RUNNER_TEMP/composition-buffer-receipt.log"

      - name: Connector tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

      - name: Connector package tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
        run: cargo test --manifest-path crates/Cargo.toml --locked -p ottto-connector-testkit --test first_party_sources

  public-surface:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
    name: Public surface checks
    timeout-minutes: 30
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install script prerequisites
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          set -euo pipefail
          brew untap aws/tap azure/bicep 2>/dev/null || true
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Public surface gate
        run: bash scripts/public_repo_surface_ci.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust-advisories:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.composition_buffer_probe) }}
    name: Rust advisory audit
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Runtime advisory audit
        run: cargo audit --deny warnings

      - name: Connector advisory audit
        run: cargo audit --deny warnings
        working-directory: crates

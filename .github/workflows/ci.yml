name: Public CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust contracts
    timeout-minutes: 40
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      OTTTO_REQUIRE_LAYOUT: "1"
      # Job-level so "Runtime tests" and "Layout coverage receipt" share one build.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Keep layout-sensitive tests on the compiler validated by the runtime.
      - name: Install validated Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      # Only main runs save; PRs restore main's cache. Workspace crates are not cached.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            crates -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      - name: macOS-native public surface checks
        # Real plutil/codesign/LaunchServices and macOS /bin/bash 3.2; the
        # portable remainder runs in "Public surface checks" on Linux.
        run: /bin/bash scripts/public_repo_surface_ci.sh --scope macos

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

      - name: Runtime clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Connector clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Runtime tests
        # Print a failing assertion when it happens, not only after the suite.
        # Four threads on the 3-core runner: many tests wait on I/O or #[serial].
        # Six exposed shared-state races (control.rs notes some fail above 4).
        run: cargo test --workspace --locked -- --nocapture --test-threads=4

      - name: Layout coverage receipt
        run: |
          set -euo pipefail
          cargo test -p ottto-service --lib --locked heap_layout_bound::sampled_scalar_buffer_tests::layout_gate_coverage_receipt -- --exact --nocapture | tee "$RUNNER_TEMP/layout-coverage-receipt.log"
          # An exact filter matching zero tests must not count as a receipt.
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/layout-coverage-receipt.log"

      - name: Connector tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

      - name: Connector package tests
        run: cargo test --manifest-path crates/Cargo.toml --locked -p ottto-connector-testkit --test first_party_sources

  public-surface:
    name: Public surface checks
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # Pinned binary with the action's per-version SHA-256; no unverified
      # cargo-install fallback.
      - name: Install shellcheck
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: shellcheck@0.11.0
          fallback: none

      - name: Tool receipt
        run: |
          set -euo pipefail
          shellcheck --version | grep -Fx 'version: 0.11.0'
          bash --version | head -n1
          jq --version
          python3 --version
          cargo -V

      - name: Public surface gate
        run: bash scripts/public_repo_surface_ci.sh --scope portable

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust-advisories:
    name: Rust advisory audit
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # cargo audit reads only the lockfiles, so the runner OS does not matter.
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Runtime advisory audit
        run: cargo audit --deny warnings

      - name: Connector advisory audit
        run: cargo audit --deny warnings
        working-directory: crates

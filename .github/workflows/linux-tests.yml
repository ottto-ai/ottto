name: Linux tests

# Early, free signal for portable tests and clippy. macOS "Rust contracts" in
# ci.yml stays authoritative for macOS-only cfg code, layout coverage, and
# native behavior. A green Linux run is never merge evidence on its own.

on:
  # Drafts skip both jobs; they run when the PR is marked ready, or on
  # `gh workflow run linux-tests.yml --ref <branch>`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # Daily main run that refreshes the shared Linux cache; PR refs only restore.
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch-once:
    # A dispatch on a head that already passed, or is still running, in any
    # Linux tests run (pull request or dispatch) skips the jobs below.
    name: Dispatch once per head
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Earlier run on this head
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(bash scripts/linux_check_state.sh "$GITHUB_SHA")"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Earlier Linux tests on $GITHUB_SHA: $state"

  rust-fmt-linux:
    # Minutes of Linux instead of a Mac round: fmt is the commonest Mac-only
    # failure, and in a merge queue a Mac failure ejects the PR.
    name: Rust format (Linux)
    needs: dispatch-once
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.dispatch-once.outputs.state != 'success' && needs.dispatch-once.outputs.state != 'pending' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with:
          components: rustfmt

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

  rust-linux-shard:
    # Three shares of the ottto-service lib tests (scripts/ci_runtime_tests.py
    # --shard), each on its own runner with main's warm cache; share 1 also
    # runs clippy, every other test target and the connector tests.
    # Heap-layout tests run here too: the lib step took 15-27 min in trial
    # runs against 7-12 before.
    name: Rust tests (Linux) shard ${{ matrix.shard }}/3
    needs: dispatch-once
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.dispatch-once.outputs.state != 'success' && needs.dispatch-once.outputs.state != 'pending' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          # The PR merge commit plus its base parent, for the PR Rust diff checks.
          fetch-depth: 2

      # Cache: only main saves, from share 1. A save per PR merge ref (~331 MB
      # each) filled the 10 GB repo cache and evicted the macOS main cache.
      # PRs restore main's entry.
      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
          linux-test-env: "true"
          cache-key: linux-tests
          cache-save: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      # Clippy owns lint policy; PR-only checks cover reuse and blanket allows.
      - name: Runtime clippy
        if: matrix.shard == 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            rust_diff=$(git diff -U0 HEAD^1 HEAD -- '*.rs') || exit 1
            rust_files=$(git diff --name-only HEAD^1 HEAD -- '*.rs') || exit 1
            [ -z "$rust_files" ] || grep -q '^Reuse:' <<< "$PR_BODY" || { echo 'error: Rust changes need a Reuse: line in the PR body'; exit 1; }
            if grep -Eq '^\+[[:space:]]*#!\[(allow|cfg_attr\(.*allow)' <<< "$rust_diff"; then echo 'error: added blanket allow'; exit 1; fi
          fi
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Connector clippy
        if: matrix.shard == 1
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings

      # Build every test binary first, then let main save the cache even if a
      # test fails, so one red main test does not leave PRs building cold. The
      # switch flips only after a complete build, so a failed, cancelled or
      # clippy-only build never stores a partial target dir under the key.
      # CACHE_ON_FAILURE is what rust-cache's post-if reads (v2.9.3 action.yml).
      # A build error here does not fail the step: the test steps below rebuild
      # and report it exactly as before.
      - name: Build tests
        run: |
          build_status=0
          cargo test --workspace --locked --no-run || build_status=$?
          if [ "${{ matrix.shard }}" = 1 ]; then
            cargo test --manifest-path crates/Cargo.toml --workspace --locked --no-run || build_status=$?
          fi
          if [ "$build_status" -eq 0 ]; then
            echo "CACHE_ON_FAILURE=true" >> "$GITHUB_ENV"
          fi

      - name: Runtime tests
        # Print a failing assertion when it happens, not only after the suite.
        # Keep going past a failing test binary so one run lists every failure.
        # Same split as the macOS job (scripts/ci_runtime_tests.py).
        run: python3 scripts/ci_runtime_tests.py --threads 3 --serial-threads 1 --no-fail-fast --shard ${{ matrix.shard }}/3

      # Includes ottto-connector-testkit's first_party_sources contract tests.
      - name: Connector tests
        if: matrix.shard == 1
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

  rust-linux:
    # The single required name (merge guard, mac_batch.py, linux_check_state.sh).
    name: Rust tests (Linux)
    needs: [dispatch-once, rust-linux-shard]
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.dispatch-once.outputs.state != 'success' && needs.dispatch-once.outputs.state != 'pending' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.rust-linux-shard.result }}
        run: |
          echo "shards: $SHARDS"
          test "$SHARDS" = success

name: Linux tests

# Early, free signal for the portable test surface. macOS "Rust contracts" in
# ci.yml stays the authority: it owns clippy, layout coverage, and native
# behavior. A green Linux run is never merge evidence on its own.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-fmt-linux:
    # Minutes of Linux instead of a Mac round: fmt is the commonest Mac-only
    # failure, and in a merge queue a Mac failure ejects the PR.
    name: Rust format (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

  rust-linux:
    name: Rust tests (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      # rusqlite links the system SQLite; command-environment tests probe zsh.
      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev zsh

      # Credential-path checks reject group/world-writable ancestors such as
      # /tmp (1777). macOS hands each user a private TMPDIR; mirror that.
      - name: Private temp directory
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      # Pull request caches are scoped to their own merge ref, so a PR cannot
      # seed another PR's restore. Fork PRs never save.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-tests
          workspaces: |
            . -> target
            crates -> crates/target
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Runtime tests
        # Print a failing assertion when it happens, not only after the suite.
        # Keep going past a failing test binary so one run lists every failure.
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture

      - name: Connector tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

      - name: Connector package tests
        run: cargo test --manifest-path crates/Cargo.toml --locked -p ottto-connector-testkit --test first_party_sources

      # W1 validation overlay: removed before final contracts; no daemon work.
      - name: W1 touched-file clippy probe
        if: always()
        run: |
          set -euo pipefail
          cargo clippy -p ottto-service --all-targets --locked --message-format=json > "$RUNNER_TEMP/w1-clippy.jsonl"
          python3 - "$RUNNER_TEMP/w1-clippy.jsonl" <<'PYCLIPPY'
          import json, sys
          paths = {"crates/ottto-service/src/snapshots.rs", "crates/ottto-service/src/snapshot_sync.rs", "crates/ottto-service/src/snapshots/claude_request_money/e2.rs", "crates/ottto-service/src/snapshot_sync/claude_money_e2_pipeline_tests.rs", "crates/ottto-service/src/snapshot_sync/money_e2_bench_tests.rs"}
          bad=[]
          for line in open(sys.argv[1]):
              r=json.loads(line)
              if r.get("reason")!="compiler-message": continue
              m=r["message"]
              if m["level"] in ("warning", "error") and any(p["file_name"] in paths for p in m["spans"]): bad.append(m)
          for m in bad: print(m["rendered"])
          assert not bad, "touched-file clippy must be clean"
          print("W1_TOUCHED_FILE_CLIPPY_CLEAN")
          PYCLIPPY
      - name: W1 same-corpus before after probe
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/w1-target"
          rel=crates/ottto-service/src/snapshot_sync/money_e2_bench_tests.rs
          cargo test -p ottto-service --lib --locked --release --no-run --message-format=json > "$RUNNER_TEMP/w1-build.jsonl"
          python3 - "$RUNNER_TEMP/w1-build.jsonl" "$RUNNER_TEMP/after" <<'PYBIN'
          import json,shutil,sys
          bins=[r["executable"] for r in map(json.loads,open(sys.argv[1])) if r.get("reason")=="compiler-artifact" and r.get("executable")]
          assert len(bins)==1,bins
          shutil.copy2(bins[0],sys.argv[2])
          PYBIN
          root="$PWD"
          for spec in before:0fb4ee57e after-release:c3b9ff2d; do
            name="${spec%%:*}"; ref="${spec#*:}"
            git worktree add --detach "$RUNNER_TEMP/$name-source" "$ref"
            cp "$root/$rel" "$RUNNER_TEMP/$name-source/$rel"
            cd "$RUNNER_TEMP/$name-source"
            cargo test -p ottto-service --lib --locked --release --no-run --message-format=json > "$RUNNER_TEMP/w1-build.jsonl"
            python3 - "$RUNNER_TEMP/w1-build.jsonl" "$RUNNER_TEMP/$name" <<'PYBIN'
          import json,shutil,sys
          bins=[r["executable"] for r in map(json.loads,open(sys.argv[1])) if r.get("reason")=="compiler-artifact" and r.get("executable")]
          assert len(bins)==1,bins
          shutil.copy2(bins[0],sys.argv[2])
          PYBIN
            cd "$root"
          done
          export OTTTO_E2_BENCH_ROOT="$RUNNER_TEMP/w1-corpus"
          test=snapshot_sync::tests::money_e2_bench_tests::money_e2_bench_receipt
          OTTTO_E2_BENCH_MODE=prepare OTTTO_E2_BENCH_SCALE=1 OTTTO_E2_BENCH_BYTES_SCALE=.05 "$RUNNER_TEMP/after" "$test" --exact --ignored --nocapture --test-threads 1 > "$RUNNER_TEMP/w1-prepare.log" 2>&1
          for name in before after-release after; do
            OTTTO_E2_BENCH_MODE=arm OTTTO_E2_BENCH_ARM=on OTTTO_E2_BENCH_TAG="$name" OTTTO_E2_BENCH_OUTPUT="$RUNNER_TEMP/w1-$name.json" "$RUNNER_TEMP/$name" "$test" --exact --ignored --nocapture --test-threads 1 > "$RUNNER_TEMP/w1-$name.log" 2>&1
            grep '^MONEY_E2_BENCH ' "$RUNNER_TEMP/w1-$name.log"
          done
          python3 - "$RUNNER_TEMP" <<'PYPARITY'
          import pathlib,json,sys
          root=pathlib.Path(sys.argv[1]); receipts={n:json.loads((root/f"w1-{n}.json").read_text()) for n in ("before","after-release","after")}
          for n,r in receipts.items(): print("W1_RECEIPT",n,json.dumps({"uploads":r["uploads"],"traversal":r["traversal"],"max_rss_bytes":r["max_rss_bytes"]}))
          assert receipts["before"]["uploads"]==receipts["after-release"]["uploads"], "release parity"
          assert receipts["before"]["uploads"]==receipts["after"]["uploads"], "scheduling parity"
          print("W1_UPLOAD_PARITY_CLEAN")
          PYPARITY
      - name: W1 probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w1-linux-probe
          path: |
            ${{ runner.temp }}/w1-*.json
            ${{ runner.temp }}/w1-*.log
            ${{ runner.temp }}/w1-clippy.jsonl

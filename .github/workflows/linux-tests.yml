name: Linux tests

# Early, free signal for portable tests and clippy. macOS "Rust contracts" in
# ci.yml stays authoritative for macOS-only cfg code, layout coverage, and
# native behavior. A green Linux run is never merge evidence on its own.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-fmt-linux:
    # Minutes of Linux instead of a Mac round: fmt is the commonest Mac-only
    # failure, and in a merge queue a Mac failure ejects the PR.
    name: Rust format (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

  rust-linux:
    name: Rust tests (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # rusqlite links the system SQLite; command-environment tests probe zsh.
      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev zsh

      # Credential-path checks reject group/world-writable ancestors such as
      # /tmp (1777). macOS hands each user a private TMPDIR; mirror that.
      - name: Private temp directory
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      # Pull request caches are scoped to their own merge ref, so a PR cannot
      # seed another PR's restore. Fork PRs never save.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-tests
          workspaces: |
            . -> target
            crates -> target
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Runtime clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Connector clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Runtime tests
        # Print a failing assertion when it happens, not only after the suite.
        # Keep going past a failing test binary so one run lists every failure.
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture

      - name: Connector tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

      - name: Connector package tests
        run: cargo test --manifest-path crates/Cargo.toml --locked -p ottto-connector-testkit --test first_party_sources

  replay-paths:
    name: Replay harness paths
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select replay paths
        id: paths
        shell: python
        run: |
          import fnmatch
          import os
          import subprocess

          # The PR merge's first parent is its base. Use NUL separation so
          # filenames never become shell commands or split across lines.
          paths = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", "HEAD^1", "HEAD",
          ]).decode().split("\0")
          patterns = [
              "crates/ottto-service/src/snapshots*",
              "crates/ottto-service/src/snapshot_sync*",
              "crates/ottto-service/src/durable_tail*",
              "crates/ottto-service/src/transcript_*",
              "crates/ottto-service/src/replay*",
              "crates/ottto-service/src/agent_status_refresh.rs",
              "crates/ottto-service/src/local_resource_diagnostics*",
              "crates/ottto-service/src/main.rs",
              "crates/ottto-service/Cargo.toml",
              "crates/ottto-service/tests/replay_harness*",
              "tools/replay_harness/*",
              ".github/workflows/linux-tests.yml",
          ]
          changed = any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in patterns)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"changed={str(changed).lower()}\n")

  # Advisory only; pending the CI-speed owner's OK. This independent job is
  # deliberately absent from required checks and does not delay default tests.
  replay-harness:
    name: Replay harness (feature)
    needs: replay-paths
    if: ${{ needs.replay-paths.outputs.changed == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # rusqlite links the system SQLite; command-environment tests probe zsh.
      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev zsh

      # Credential-path checks reject group/world-writable ancestors such as
      # /tmp (1777). macOS hands each user a private TMPDIR; mirror that.
      - name: Private temp directory
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      # Pull request caches are scoped to their own merge ref, so a PR cannot
      # seed another PR's restore. Fork PRs never save.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-tests
          workspaces: |
            . -> target
            crates -> target
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Replay harness (feature)
        if: ${{ !cancelled() }}
        run: |
          replay_status=0
          cargo test -p ottto-service --test replay_harness --features replay-harness --locked -- --nocapture || replay_status=$?
          cargo test -p ottto-service --lib --features replay-harness --locked snapshot_sync::replay_harness::oracle_tests -- --nocapture || replay_status=$?
          exit "$replay_status"

name: Linux tests

# Early, free signal for portable tests and clippy. macOS "Rust contracts" in
# ci.yml stays authoritative for macOS-only cfg code, layout coverage, and
# native behavior. A green Linux run is never merge evidence on its own.

on:
  pull_request:
  workflow_dispatch:
  # Daily main run that refreshes the shared Linux cache; PR refs only restore.
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-fmt-linux:
    # Minutes of Linux instead of a Mac round: fmt is the commonest Mac-only
    # failure, and in a merge queue a Mac failure ejects the PR.
    name: Rust format (Linux)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Rust format
        run: cargo fmt --all --check

      - name: Connector format
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

  rust-linux:
    name: Rust tests (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # rusqlite links the system SQLite; command-environment tests probe zsh.
      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev zsh

      # Credential-path checks reject group/world-writable ancestors such as
      # /tmp (1777). macOS hands each user a private TMPDIR; mirror that.
      - name: Private temp directory
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      # Only main saves. A save per PR merge ref (~331 MB each) filled the 10 GB
      # repo cache and evicted the macOS main cache. PRs restore main's entry.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-tests
          workspaces: |
            . -> target
            crates -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Runtime clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Connector clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings

      # Build every test binary first, then let main save the cache even if a
      # test fails, so one red main test does not leave PRs building cold. The
      # switch flips only after a complete build, so a failed, cancelled or
      # clippy-only build never stores a partial target dir under the key.
      # CACHE_ON_FAILURE is what rust-cache's post-if reads (v2.9.3 action.yml).
      # A build error here does not fail the step: the test steps below rebuild
      # and report it exactly as before.
      - name: Build tests
        run: |
          build_status=0
          cargo test --workspace --locked --no-run || build_status=$?
          cargo test --manifest-path crates/Cargo.toml --workspace --locked --no-run || build_status=$?
          if [ "$build_status" -eq 0 ]; then
            echo "CACHE_ON_FAILURE=true" >> "$GITHUB_ENV"
          fi

      - name: Runtime tests
        # Print a failing assertion when it happens, not only after the suite.
        # Keep going past a failing test binary so one run lists every failure.
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture

      - name: Connector tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

      - name: Connector package tests
        run: cargo test --manifest-path crates/Cargo.toml --locked -p ottto-connector-testkit --test first_party_sources

name: Linux tests

# Throwaway historical writer recipe. Never merge this branch.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-linux:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/i1/goldens-gen-53d05a43'
    name: Generate v1 goldens (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      CARGO_TERM_COLOR: never
      GENERATOR_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout exact generator commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev zsh

      - name: Private temp directory
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "GOLDENS_OUT=$RUNNER_TEMP/goldens" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-tests
          workspaces: . -> target

      - name: Generate exactly four records with exactly one test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GENERATOR_COMMIT"
          cargo test -p ottto-service --lib --locked snapshots::sampled_jsonl::durable::tests::generate_53d05a43_v1_goldens -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/generator.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/generator.log"

      - name: Record provenance and unchanged production source
        shell: bash
        run: |
          set -euo pipefail
          {
            rustc -Vv
            cargo -V
            uname -srm
            cat /etc/os-release
          } > "$GOLDENS_OUT/toolchain-os-receipt.txt"
          cp "$RUNNER_TEMP/generator.log" "$GOLDENS_OUT/generator.log"
          git diff 53d05a4304f2e87effbaa48661e10286bff01c58..HEAD > "$GOLDENS_OUT/generator.patch"
          test "$(git diff --name-only 53d05a4304f2e87effbaa48661e10286bff01c58..HEAD -- . ':!.github' ':!crates/ottto-service/src/snapshots/sampled_jsonl/durable_tests.rs')" = ""
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['GOLDENS_OUT'])
          path = out / 'MANIFEST.json'
          manifest = json.loads(path.read_text())
          manifest.update(
              run_id=os.environ['GITHUB_RUN_ID'],
              run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              run_url=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              artifact={'id': None, 'name': 'v1-goldens-53d05a43'},
              rustc=subprocess.check_output(['rustc', '-Vv'], text=True).strip(),
              toolchain=os.environ['RUSTUP_TOOLCHAIN'],
              runner_os=os.environ['RUNNER_OS'],
              runner_arch=os.environ['RUNNER_ARCH'],
          )
          # Actions allocates the artifact ID at upload. I1 records that ID from
          # the upload receipt when retaining the artifact; never invent one.
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload historical writer evidence
        id: goldens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, same pin as ci.yml
        with:
          name: v1-goldens-53d05a43
          path: ${{ runner.temp }}/goldens
          if-no-files-found: error
          retention-days: 90

      - name: Artifact identity receipt
        env:
          ARTIFACT_ID: ${{ steps.goldens.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.goldens.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.goldens.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\nArtifact digest: %s\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

name: Linux tests

# Early, free signal for the portable test surface. macOS "Rust contracts" in
# ci.yml stays the authority: it owns clippy, layout coverage, and native
# behavior. A green Linux run is never merge evidence on its own.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-linux:
    name: Rust tests (Linux)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # rusqlite links the system SQLite; command-environment tests probe zsh.
      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev zsh

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Compiler receipt
        run: rustc -Vv && cargo -V

      # Pull request caches are scoped to their own merge ref, so a PR cannot
      # seed another PR's restore. Fork PRs never save.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-tests
          workspaces: |
            . -> target
            crates -> crates/target
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Runtime tests
        # Print a failing assertion when it happens, not only after the suite.
        run: cargo test --workspace --locked -- --nocapture

      - name: Connector tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace --locked

      - name: Connector package tests
        run: cargo test --manifest-path crates/Cargo.toml --locked -p ottto-connector-testkit --test first_party_sources

name: macOS Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable or stable-candidate version to build.
        required: true
        type: string
      channel:
        description: Release channel to package.
        required: true
        type: choice
        options:
          - stable-candidate
          - stable
      artifact_base_url:
        description: Immutable HTTPS release prefix for workflow artifacts.
        required: true
        type: string
      release_notes:
        description: User-facing What's new text for the manifest and Sparkle appcast.
        required: true
        type: string
      publish_intent:
        description: Public workflow output only; CDN publication is manual and private.
        required: true
        default: none
        type: choice
        options:
          - none
      release_mode:
        description: Standard release, or an explicitly approved manual-only stable without QA/Sparkle publication.
        required: true
        default: standard
        type: choice
        options:
          - standard
          - manual-no-sparkle
      operator_approval:
        description: Required approval phrase for manual-no-sparkle releases.
        required: false
        default: ""
        type: string
      github_release_mirror:
        description: Disabled until the mirror publishes the operator-checked release folder; this input currently has no effect. Never touches the CDN or channel promotion.
        required: false
        default: false
        type: boolean

concurrency:
  group: macos-stable-release-${{ github.ref }}-${{ inputs.channel }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  # contents: write is required only so the optional, input-gated GitHub Release
  # verification mirror can publish a release for the existing tag. It never
  # publishes to the CDN or promotes a channel; the CDN remains the install/update
  # source of truth.
  contents: write
  # Read the Public CI run and jobs that tested the tagged commit.
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-sign-notarize:
    name: Build, sign, notarize, attest
    environment: macos-stable-release
    timeout-minutes: 180
    # After AWS EC2 Mac migration, set OTTTO_MACOS_STABLE_RUNNER_LABELS to
    # ["self-hosted","macOS","ottto-signing-mac","ottto-cloud-mac"].
    runs-on: ${{ fromJSON(vars.OTTTO_MACOS_STABLE_RUNNER_LABELS || '["self-hosted","macOS","ottto-signing-mac","ottto-release-bootstrap"]') }}
    env:
      OTTTO_MACOS_CODESIGN_IDENTITY: ${{ secrets.OTTTO_MACOS_CODESIGN_IDENTITY }}
      OTTTO_NOTARY_PROFILE: ${{ secrets.OTTTO_NOTARY_PROFILE }}
      OTTTO_NOTARY_WAIT_TIMEOUT: ${{ vars.OTTTO_NOTARY_WAIT_TIMEOUT || '30m' }}
      OTTTO_RELEASE_REPOSITORY: ${{ github.repository }}
      OTTTO_RELEASE_SIGNER_WORKFLOW: .github/workflows/macos-stable-release.yml
      OTTTO_RELEASE_SOURCE_REF: ${{ github.ref }}
      # Release privacy gate (docs/release-verification.md). The policy is not
      # secret; the marker list secret goes only to the gate steps.
      OTTTO_RELEASE_PRIVACY_POLICY: ${{ vars.OTTTO_RELEASE_PRIVACY_POLICY }}
      OTTTO_RELEASE_LANE: ${{ inputs.channel == 'stable-candidate' && 'candidate' || (inputs.release_mode == 'manual-no-sparkle' && 'manual' || 'stable') }}
    steps:
      # Checkout prints its temporary folder, and setup output comes before the
      # mask step: the job runs only in the release host's neutral per-run work
      # folder (docs/release-verification.md, "Release host runner").
      - name: Check neutral runner paths
        run: |
          set -euo pipefail
          work="/opt/ottto-release/runners/$GITHUB_RUN_ID/_work"
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ || "$RUNNER_TEMP" != "$work/_temp" ||
                "$GITHUB_WORKSPACE" != "$work/$repo/$repo" ]]; then
            echo "The job is not in the release host's neutral work folder." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        env:
          # No account Git config to copy, so checkout names no home path.
          HOME: ${{ runner.temp }}/checkout-home
        with:
          persist-credentials: false
          # Full history for the first-parent check on main.
          fetch-depth: 0

      # First trusted step: check the policy and the marker list digest, check
      # the secret-backed tool selectors (notary profile, signing identity),
      # mask every marker and host string in later log output, create the
      # neutral work folder (OTTTO_PRIVACY_WORK) and record this attempt's
      # policy and list digests; every later gate step must match them.
      - name: Load release privacy policy
        env:
          OTTTO_PRIVACY_MARKERS: ${{ secrets.OTTTO_PRIVACY_MARKERS }}
        run: python3 -I scripts/macos_privacy_gate.py register-masks

      # Before any step can print an input value: every dispatch input is
      # checked for private strings. The gate reads the inputs from the event
      # file, because the runner prints a step's environment before its
      # script runs. Later messages name no input value.
      - name: Check dispatch inputs for private strings
        env:
          OTTTO_PRIVACY_MARKERS: ${{ secrets.OTTTO_PRIVACY_MARKERS }}
        run: python3 -I scripts/macos_privacy_gate.py scan --profile dispatch --state "$OTTTO_PRIVACY_WORK/state" >/dev/null

      - name: Enforce dispatch policy
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PUBLISH_INTENT: ${{ inputs.publish_intent }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          OPERATOR_APPROVAL: ${{ inputs.operator_approval }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "macOS stable releases are workflow_dispatch only." >&2
            exit 1
          fi
          # Releases build only from a v<X.Y.Z> release tag; any other ref fails.
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "macOS stable releases must run from a v<X.Y.Z> release tag." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF#refs/tags/v}"
          # Reject any version that is not formula/installer-safe before it can
          # reach a run: block. Uses the SAME bash `[[ =~ ]]` construct as the
          # downstream scripts/homebrew_formula.sh and
          # scripts/hosted_native_installer.sh so the accepted set is byte
          # identical — unlike a line-oriented `grep`, the bash regex anchors the
          # whole string and so also rejects multiline `inputs.version` values.
          # Validation tests the env-bound shell variable "$VERSION", never the
          # raw input expression, so the check is not itself injectable.
          if [[ ! "$VERSION" =~ ^[0-9]+([.][0-9]+){1,3}([_+.-][A-Za-z0-9]+)?$ ]]; then
            echo "Invalid version input." >&2
            exit 1
          fi
          if [[ "$PUBLISH_INTENT" != "none" ]]; then
            echo "The public workflow never publishes or promotes release channels." >&2
            exit 1
          fi
          if [[ "$RELEASE_MODE" == "manual-no-sparkle" ]]; then
            if [[ "$CHANNEL" != "stable" ]]; then
              echo "manual-no-sparkle is valid only for a stable release." >&2
              exit 1
            fi
            if [[ "$OPERATOR_APPROVAL" != "RON_APPROVED_FASTLANE_MANUAL_STABLE" ]]; then
              echo "manual-no-sparkle requires the exact operator approval phrase." >&2
              exit 1
            fi
          elif [[ "$RELEASE_MODE" != "standard" ]]; then
            echo "Unsupported release_mode." >&2
            exit 1
          fi
          if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo "release_notes is required for macOS stable release artifacts." >&2
            exit 1
          fi
          # Literal string compares, so the dots in the tag are not regex wildcards.
          case "$CHANNEL" in
            stable)
              if [[ "$VERSION" != "$tag_version" ]]; then
                echo "Stable version does not match tag v$tag_version." >&2
                exit 1
              fi
              ;;
            stable-candidate)
              if [[ "$VERSION" != "$tag_version"-rc* || ! "${VERSION#"$tag_version"-rc}" =~ ^[0-9]+$ ]]; then
                echo "Stable-candidate version must be $tag_version-rc<N> for tag v$tag_version." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release channel." >&2
              exit 1
              ;;
          esac
          case "$ARTIFACT_BASE_URL" in
            https://*)
              if [[ "$ARTIFACT_BASE_URL" == *"/latest"* ]]; then
                echo "artifact_base_url must be an immutable versioned prefix." >&2
                exit 1
              fi
              ;;
            *)
              echo "artifact_base_url must use HTTPS." >&2
              exit 1
              ;;
          esac

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/macos_quiet_step.sh "release source" scripts/macos_release_source_check.sh release

      - name: Check signing runner readiness
        run: |
          set -euo pipefail
          for command in jq shasum swift cargo ditto hdiutil plutil codesign spctl xcrun gh security; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "Required command not found: $command" >&2
              exit 2
            }
          done
          test -n "$OTTTO_MACOS_CODESIGN_IDENTITY" || {
            echo "OTTTO_MACOS_CODESIGN_IDENTITY is required." >&2
            exit 2
          }
          test -n "$OTTTO_NOTARY_PROFILE" || {
            echo "OTTTO_NOTARY_PROFILE is required." >&2
            exit 2
          }
          # Both selectors passed the privacy gate's selector check in the first step.
          security find-identity -v -p codesigning 2>/dev/null | grep -F "$OTTTO_MACOS_CODESIGN_IDENTITY" >/dev/null || {
            echo "The signing identity is not in the runner's keychain." >&2
            exit 2
          }
          xcrun notarytool history --keychain-profile "$OTTTO_NOTARY_PROFILE" >/dev/null 2>&1 || {
            echo "The notary profile does not work on this runner." >&2
            exit 2
          }

      - name: Prepare unsigned macOS artifacts
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          # The app root comes from the runner environment (OTTTO_MACOS_APP_ROOT),
          # not argv; output is discarded and one status line printed.
          test -n "${OTTTO_MACOS_APP_ROOT:-}" || { echo "OTTTO_MACOS_APP_ROOT is required." >&2; exit 2; }
          scripts/macos_quiet_step.sh "package prepare" scripts/macos_package.sh \
            --stage prepare \
            --app-source-commit "$OTTTO_MACOS_APP_SOURCE_COMMIT" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --artifact-base-url "$ARTIFACT_BASE_URL" \
            --release-notes "$RELEASE_NOTES"

      - name: Check unsigned artifacts for private strings
        env:
          OTTTO_PRIVACY_MARKERS: ${{ secrets.OTTTO_PRIVACY_MARKERS }}
        run: python3 -I scripts/macos_privacy_gate.py scan --profile unsigned --root dist/macos --state "$OTTTO_PRIVACY_WORK/state" >/dev/null

      - name: Package signed macOS artifacts
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          # The app root comes from the runner environment (OTTTO_MACOS_APP_ROOT),
          # not argv; output is discarded and one status line printed.
          test -n "${OTTTO_MACOS_APP_ROOT:-}" || { echo "OTTTO_MACOS_APP_ROOT is required." >&2; exit 2; }
          scripts/macos_quiet_step.sh "package finish" scripts/macos_package.sh \
            --stage finish \
            --privacy-state "$OTTTO_PRIVACY_WORK/state" \
            --app-source-commit "$OTTTO_MACOS_APP_SOURCE_COMMIT" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --artifact-base-url "$ARTIFACT_BASE_URL" \
            --release-notes "$RELEASE_NOTES"

      # The notarization helper seals and checks each of the four archives
      # (app ZIP, rebuilt DMG, CLI ZIP, service ZIP) before it submits it.
      - name: Notarize and staple artifacts
        env:
          OTTTO_PRIVACY_MARKERS: ${{ secrets.OTTTO_PRIVACY_MARKERS }}
        run: |
          set -euo pipefail
          scripts/macos_quiet_step.sh notarize scripts/macos_notarize.sh \
            --manifest dist/macos/release-manifest.json \
            --keychain-profile "$OTTTO_NOTARY_PROFILE" \
            --timeout "$OTTTO_NOTARY_WAIT_TIMEOUT"

      - name: Record manual release waiver
        if: inputs.channel == 'stable' && inputs.release_mode == 'manual-no-sparkle'
        run: |
          set -euo pipefail
          checked_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          jq \
            --arg checked_at "$checked_at" \
            '.release_mode = "manual-no-sparkle"
             | .quality_gates.stable_candidate_rc = {
                 status: "waived",
                 checked_at: $checked_at,
                 reason: "Operator-approved manual release lane"
               }
             | .quality_gates.stable_clean_machine_qa = {
                 status: "waived",
                 checked_at: $checked_at,
                 reason: "Operator explicitly waived QA for this manual release"
               }
             | .quality_gates.sparkle_appcast = {
                 status: "disabled",
                 checked_at: $checked_at,
                 reason: "Existing Sparkle private key unavailable on the release host"
               }
             | .quality_gates.artifact_attestations = {
                 status: "waived",
                 checked_at: $checked_at,
                 reason: "Operator-approved manual release; signed and notarized artifacts remain required"
               }' \
            dist/macos/release-manifest.json > dist/macos/release-manifest.json.next
          mv dist/macos/release-manifest.json.next dist/macos/release-manifest.json

      # Host paths stay out of every printed step environment: the release
      # host's runner environment names the file, and the shell opens it by
      # redirection, so no command gets the path on its argv.
      - name: Bind stable-candidate RC evidence
        if: inputs.channel == 'stable' && inputs.release_mode == 'standard'
        run: |
          set -euo pipefail
          test -n "${OTTTO_STABLE_CANDIDATE_RC_EVIDENCE:-}" || {
            echo "OTTTO_STABLE_CANDIDATE_RC_EVIDENCE must be set in the release runner's environment for stable releases." >&2
            exit 1
          }
          test -f "$OTTTO_STABLE_CANDIDATE_RC_EVIDENCE" || {
            echo "Stable-candidate RC evidence file named by OTTTO_STABLE_CANDIDATE_RC_EVIDENCE does not exist." >&2
            exit 1
          }
          cat < "$OTTTO_STABLE_CANDIDATE_RC_EVIDENCE" > dist/macos/stable-candidate-rc-qa.json
          candidate_sha="$(jq -r '.candidate_manifest.sha256 // empty' dist/macos/stable-candidate-rc-qa.json)"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Stable-candidate RC evidence is missing candidate_manifest.sha256." >&2
            exit 1
          fi
          # The template's unfilled placeholder is not a supplied sampler scorecard.
          if jq -e '.resource_scorecard != null and .resource_scorecard != {
            schema_version: 1, policy: "resource-stage1-v1", status: "not_run"
          }' dist/macos/stable-candidate-rc-qa.json > /dev/null; then
            python3 scripts/resource_scorecard.py dist/macos/stable-candidate-rc-qa.json >/dev/null 2>&1 || {
              echo "Stable-candidate RC evidence has an invalid resource scorecard." >&2
              exit 1
            }
          else
            echo "resource scorecard: absent"
          fi
          jq -e --slurpfile evidence dist/macos/stable-candidate-rc-qa.json \
            '.commit == $evidence[0].candidate_manifest.commit' dist/macos/release-manifest.json > /dev/null
          jq \
            --arg evidence_path "stable-candidate-rc-qa.json" \
            --arg candidate_sha "$candidate_sha" \
            --arg checked_at "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '.quality_gates.stable_candidate_rc = {
              status: "passed",
              checked_at: $checked_at,
              evidence_path: $evidence_path,
              candidate_manifest_sha256: $candidate_sha
            }' \
            dist/macos/release-manifest.json > dist/macos/release-manifest.json.next
          mv dist/macos/release-manifest.json.next dist/macos/release-manifest.json

      - name: Generate stable install artifacts
        if: inputs.channel == 'stable'
        run: |
          set -euo pipefail
          scripts/macos_quiet_step.sh "homebrew formula" scripts/homebrew_formula.sh \
            --manifest dist/macos/release-manifest.json \
            --output dist/macos/homebrew/ottto.rb
          scripts/macos_quiet_step.sh "stable installer" scripts/hosted_native_installer.sh \
            --manifest dist/macos/release-manifest.json \
            --output dist/macos/install-macos.sh \
            --record-sha256

      - name: Generate attestation subject checksums
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          (
            cd dist/macos
            subjects=(
              Ottto-macos-*.dmg
              ottto-macos-*.zip
              ottto-service-macos-*.zip
              ottto-local-platform-sbom.cdx.json
              release-manifest.json
            )
            if [[ "$CHANNEL" == "stable" ]]; then
              subjects+=(install-macos.sh)
            fi
            shasum -a 256 "${subjects[@]}" > subject.checksums.txt
          )

      # Attestations read only the sealed, checked copies.
      - name: Seal first attestation subjects
        if: inputs.release_mode == 'standard'
        env:
          OTTTO_PRIVACY_MARKERS: ${{ secrets.OTTTO_PRIVACY_MARKERS }}
        run: python3 -I scripts/macos_privacy_gate.py scan --profile attest --lane "$OTTTO_RELEASE_LANE" --stage attest-1 --seal-from dist/macos --root "$OTTTO_PRIVACY_WORK/attest-1" --state "$OTTTO_PRIVACY_WORK/state" >/dev/null

      - name: Create provenance attestation
        if: inputs.release_mode == 'standard'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ env.OTTTO_PRIVACY_WORK }}/attest-1/subject.checksums.txt

      - name: Create SBOM attestation
        if: inputs.release_mode == 'standard'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ env.OTTTO_PRIVACY_WORK }}/attest-1/subject.checksums.txt
          sbom-path: ${{ env.OTTTO_PRIVACY_WORK }}/attest-1/ottto-local-platform-sbom.cdx.json

      - name: Bind verified attestation metadata
        if: inputs.release_mode == 'standard'
        run: |
          set -euo pipefail
          scripts/macos_quiet_step.sh "attestation bind" scripts/macos_attestation_bind.sh \
            --manifest dist/macos/release-manifest.json \
            --subject-checksums dist/macos/subject.checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow .github/workflows/macos-stable-release.yml

      - name: Regenerate checksums for bound manifest
        if: inputs.release_mode == 'standard'
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          (
            cd dist/macos
            subjects=(
              Ottto-macos-*.dmg
              ottto-macos-*.zip
              ottto-service-macos-*.zip
              ottto-local-platform-sbom.cdx.json
              release-manifest.json
            )
            if [[ "$CHANNEL" == "stable" ]]; then
              subjects+=(install-macos.sh)
            fi
            shasum -a 256 "${subjects[@]}" > subject.checksums.txt
          )

      - name: Seal final attestation subjects
        if: inputs.release_mode == 'standard'
        env:
          OTTTO_PRIVACY_MARKERS: ${{ secrets.OTTTO_PRIVACY_MARKERS }}
        run: python3 -I scripts/macos_privacy_gate.py scan --profile attest --lane "$OTTTO_RELEASE_LANE" --stage attest-2 --seal-from dist/macos --root "$OTTTO_PRIVACY_WORK/attest-2" --state "$OTTTO_PRIVACY_WORK/state" >/dev/null

      - name: Create final provenance attestation
        if: inputs.release_mode == 'standard'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ env.OTTTO_PRIVACY_WORK }}/attest-2/subject.checksums.txt

      - name: Create final SBOM attestation
        if: inputs.release_mode == 'standard'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ env.OTTTO_PRIVACY_WORK }}/attest-2/subject.checksums.txt
          sbom-path: ${{ env.OTTTO_PRIVACY_WORK }}/attest-2/ottto-local-platform-sbom.cdx.json

      # Read-only on the frozen final set: nothing is rewritten after its seal.
      - name: Verify final attestations and manifest binding
        if: inputs.release_mode == 'standard'
        run: |
          set -euo pipefail
          scripts/macos_quiet_step.sh "attestation verify" scripts/macos_attestation_bind.sh \
            --verify-only \
            --manifest "$OTTTO_PRIVACY_WORK/attest-2/release-manifest.json" \
            --subject-checksums "$OTTTO_PRIVACY_WORK/attest-2/subject.checksums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow .github/workflows/macos-stable-release.yml
          scripts/macos_quiet_step.sh "release gate" scripts/macos_release_gate.sh --manifest dist/macos/release-manifest.json

      - name: Sign and verify release manifest
        if: inputs.release_mode == 'standard'
        run: |
          set -euo pipefail
          scripts/macos_quiet_step.sh "manifest sign" scripts/macos_manifest_signature.sh sign \
            --manifest dist/macos/release-manifest.json \
            --identity "$OTTTO_MACOS_CODESIGN_IDENTITY"
          scripts/macos_quiet_step.sh "manifest verify" scripts/macos_manifest_signature.sh verify \
            --manifest dist/macos/release-manifest.json

      # The release host's runner environment names the keychain (never a
      # printed step environment). Tools get a neutral link in the gate's work
      # folder, made from the environment, so no argv carries the keychain path.
      - name: Sign and verify release manifest from manual keychain
        if: inputs.release_mode == 'manual-no-sparkle'
        run: |
          set -euo pipefail
          test -n "${OTTTO_MANUAL_SIGNING_KEYCHAIN:-}" || {
            echo "OTTTO_MANUAL_SIGNING_KEYCHAIN must be set in the release runner's environment for a manual release." >&2
            exit 2
          }
          test -f "$OTTTO_MANUAL_SIGNING_KEYCHAIN" || {
            echo "Manual signing keychain does not exist." >&2
            exit 2
          }
          keychain="$OTTTO_PRIVACY_WORK/manual-signing.keychain-db"
          OTTTO_KEYCHAIN_LINK="$keychain" python3 -I -c \
            'import os; os.symlink(os.environ["OTTTO_MANUAL_SIGNING_KEYCHAIN"], os.environ["OTTTO_KEYCHAIN_LINK"])'
          scripts/macos_quiet_step.sh "manifest sign" scripts/macos_manifest_signature.sh sign \
            --manifest dist/macos/release-manifest.json \
            --identity "$OTTTO_MACOS_CODESIGN_IDENTITY" \
            --keychain "$keychain"
          scripts/macos_quiet_step.sh "manifest verify" scripts/macos_manifest_signature.sh verify \
            --manifest dist/macos/release-manifest.json \
            --identity "$OTTTO_MACOS_CODESIGN_IDENTITY" \
            --keychain "$keychain"
          rm -f "$keychain"

      - name: Run stable preflight
        if: inputs.channel == 'stable' && inputs.release_mode == 'standard'
        run: |
          set -euo pipefail
          scripts/macos_quiet_step.sh "stable preflight" scripts/macos_stable_preflight.sh \
            --manifest dist/macos/release-manifest.json \
            --require-installer-sha256 \
            --sign-identity "$OTTTO_MACOS_CODESIGN_IDENTITY" \
            --keychain-profile "$OTTTO_NOTARY_PROFILE"

      # Seal the lane's exact upload set, check it and add the privacy
      # receipt; the uploader reads only the sealed folder.
      - name: Seal upload set
        env:
          OTTTO_PRIVACY_MARKERS: ${{ secrets.OTTTO_PRIVACY_MARKERS }}
        run: python3 -I scripts/macos_privacy_gate.py scan --profile upload --lane "$OTTTO_RELEASE_LANE" --seal-from dist/macos --root "$OTTTO_PRIVACY_WORK/upload" --state "$OTTTO_PRIVACY_WORK/state" >/dev/null

      - name: Upload release workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ottto-macos-${{ inputs.channel }}-${{ inputs.version }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          # These are manual-download build outputs only; CDN publication is separate
          # and manual, so artifacts need only a short window to be fetched. Keep stable
          # builds long enough for the operator to publish; expire throwaway candidates fast.
          # Prevents the org's 0.5 GB free Actions/Packages storage from filling up.
          retention-days: ${{ inputs.channel == 'stable' && 7 || 1 }}
          path: ${{ env.OTTTO_PRIVACY_WORK }}/upload/

      # Disabled: this step would publish the runner's build before the
      # operator's release-folder privacy check. Re-enable it only together
      # with a gate on the exact files it publishes.
      - name: Mirror stable build to GitHub Release (verification only)
        if: false && inputs.channel == 'stable' && inputs.github_release_mirror == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          tag="${GITHUB_REF#refs/tags/}"
          # Verification mirror only: the CDN at install.ottto.net stays the install and
          # update source of truth. This step never promotes a channel pointer or writes
          # to the CDN; it only publishes signed verification assets to a GitHub Release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refusing to overwrite a published release." >&2
            exit 1
          fi
          # Publish a release for the existing release tag only; never create a tag.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ottto ${version}" \
            --notes "Public verification mirror for Ottto ${version}. Install and update source of truth is the CDN; these assets exist for signature and checksum verification only." \
            dist/macos/Ottto-macos-*.dmg \
            dist/macos/ottto-macos-*.zip \
            dist/macos/ottto-service-macos-*.zip \
            dist/macos/ottto-local-platform-sbom.cdx.json \
            dist/macos/release-manifest.json \
            dist/macos/release-manifest.json.sig \
            dist/macos/subject.checksums.txt

      - name: Remove sealed release copies
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${OTTTO_PRIVACY_WORK:-}" && -d "$OTTTO_PRIVACY_WORK" ]]; then
            chflags -R nouchg "$OTTTO_PRIVACY_WORK"
            rm -rf "$OTTTO_PRIVACY_WORK"
          fi
          if [[ -d dist/macos ]]; then
            chflags -R nouchg dist/macos
          fi

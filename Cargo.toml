[workspace]
resolver = "2"
members = [
  "crates/ottto-protocol",
  "crates/ottto-core",
  "crates/ottto-service",
  "crates/ottto-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.81"
authors = ["Ottto Team"]

# CI runs clippy with -D warnings, so "warn" fails the build. Every member
# crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
cc = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
# Compile debug/trace records out of every crate in any build that links
# ottto-service. Pinned ureq logs each request prelude at debug level and
# redacts only Authorization and Cookie, so a host logger would otherwise
# receive custom credential headers verbatim. Both caps are needed: the
# release_* features take precedence in release builds.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
notify = "8"
notify-debouncer-full = "0.6"
plist = "1"
prost = "0.13"
security-framework = "3.7"
security-framework-sys = "2.17"
# 0.39.0 is the first rusqlite release bundling SQLite 3.51.3 (WAL-reset fix).
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23.19", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial_test = "3"
sha2 = "0.10"
ring = "0.17.14"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml_edit = "0.22"
unicode-normalization = "0.1"
unicode-general-category = "0.6"
ureq = { version = "2", default-features = false, features = ["gzip", "json"] }
webpki-roots = "1.0.10"
zeroize = { version = "1", features = ["alloc"] }
zstd = { version = "0.14.3", default-features = false, features = ["experimental"] }

# Optimise dependencies (not workspace crates) in test builds; debug
# assertions and overflow checks stay on.
[profile.test.package."*"]
opt-level = 2

[workspace]
resolver = "2"
members = [
  "ottto-connector-sdk",
  "ottto-connector-testkit",
]

# Same lint floor as the runtime workspace (../Cargo.toml).
[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Raising rust-version to 1.95 turns on this MSRV-gated lint across ~190
# existing `map_or(true|false, ..)` calls. Migrating them to `is_none_or` /
# `is_some_and` is a separate mechanical cleanup.
unnecessary_map_or = "allow"

# Optimise dependencies (not workspace crates) in test builds; debug
# assertions and overflow checks stay on.
[profile.test.package."*"]
opt-level = 2

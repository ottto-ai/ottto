[workspace]
resolver = "2"
members = [
  "ottto-connector-sdk",
  "ottto-connector-testkit",
]

# Same lint floor as the runtime workspace (../Cargo.toml).
[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Raising rust-version to 1.95 turns on these MSRV-gated lints across
# existing code (~190 `map_or(true|false, ..)` calls, plus `% n == 0`,
# `repeat().take()` and the boolean forms they suggest). Migrating to
# `is_none_or` / `is_some_and` / `is_multiple_of` / `repeat_n` is a separate
# mechanical cleanup.
manual_is_multiple_of = "allow"
manual_repeat_n = "allow"
nonminimal_bool = "allow"
unnecessary_map_or = "allow"
# Edition 2024 extends collapsible_if to nested `if let`, suggesting let
# chains. Applying them and re-enabling the lint is tracked in #1557.
collapsible_if = "allow"
# Rust 1.99 Clippy suggests `as_chunks` for constant `chunks_exact` sizes in
# the digest and fingerprint codecs; that rewrite is a separate cleanup too.
chunks_exact_to_as_chunks = "allow"

# Optimise dependencies (not workspace crates) in test builds; debug
# assertions and overflow checks stay on.
[profile.test.package."*"]
opt-level = 2
